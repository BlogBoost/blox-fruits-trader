<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaGen</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .wrap { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; color: #ff4b2b; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        label { display: block; color: #aaa; margin-bottom: 10px; font-size: 14px; }
        .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .cat { background: #2a2a2a; border: 2px solid transparent; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .cat.active { border-color: #ff4b2b; background: rgba(255,75,43,0.1); }
        button.main { width: 100%; background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4); }
        #result { display: none; }
        h2 { margin: 10px 0; color: #ff4b2b; }
        p { color: #ccc; line-height: 1.5; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .actions button { background: #2a2a2a; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; }
        #history { color: #888; font-size: 14px; line-height: 1.6; }
        @media(max-width: 480px){ .hero h1{font-size:28px;} .cats{grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="hero">
            <div class="logo">⚡</div>
            <h1>IdeaGen</h1>
            <p>Генератор идей для твоих проектов</p>
        </header>

        <section class="card">
            <label>Выбери категорию</label>
            <div class="cats" id="cats"></div>
            <button class="main" onclick="generate()">✨ Сгенерировать идею</button>
        </section>

        <section class="card result" id="result">
            <span class="tag" id="tag"></span>
            <h2 id="title"></h2>
            <p id="desc"></p>
            <p><b>Как начать:</b> <span id="start"></span></p>
            <div class="actions">
                <button onclick="generate()">Еще идея</button>
                <button onclick="copyIdea()">📋 Копировать</button>
            </div>
        </section>

        <section class="card">
            <label>Последние идеи</label>
            <div class="history" id="history">Пока пусто — сгенерируй первую идею.</div>
        </section>

        <!-- КНОПКА ДОНАТА DONATIONALERTS -->
        <div style="text-align: center; margin: 40px auto 20px auto; padding: 20px; background: #1e1e1e; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <p style="color: #aaa; font-size: 15px; margin-top: 0; margin-bottom: 15px;">Если вам понравился генератор, вы можете поддержать автора:</p>
            <a href="https://www.donationalerts.com/r/ghoul_kanekiken" target="_blank" style="
                display: inline-flex;
                align-items: center;
                background: linear-gradient(135deg, #ff9900, #ff5500);
                color: white;
                text-decoration: none;
                padding: 12px 30px;
                font-size: 16px;
                font-weight: bold;
                border-radius: 50px;
                box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
                transition: 0.2s;
            ">
                <span style="margin-right: 8px;">👑</span> Поддержать через DonationAlerts
            </a>
        </div>
    </div>

    <script>
    const data = {
        "🎮 Игры": [
            ["Челлендж на 24 часа", "Выбери игру и придумай необычное ограничение: пройти уровень только одним оружием или способом.", "Пройти уровень"],
            ["Рейтинг игр для слабых телефонов", "Составь список игр, которые хорошо работают на недорогих смартфонах.", "Добавь FPS, создай топ"],
            ["Случайный игровой челлендж", "Создай генератор случайных заданий для любимой игры.", "Начни с 30 заданий и добавь кнопку сбора"]
        ],
        "🎥 YouTube / Shorts": [
            ["Угадай игру по 3 подсказкам", "Зритель получает три подсказки и должен угадать игру.", "Сделай 10 выпусков по 20-30 секунд"],
            ["Топ-5 секретов", "Расскажи пять малоизвестных фактов об игре.", "Каждый факт показывай отдельным коротким фрагментом."],
            ["Что будет, если...?", "Придумай необычный эксперимент в игре.", "Запиши результат и попроси зрителей предложить следующий"]
        ],
        "🎵 TikTok": [
            ["1 факт за 15 секунд", "Один короткий интересный факт на каждое видео.", "Сделай крупный текст на экране и один факт без лишних слов"],
            ["Выбор подписчиков", "Дай зрителям два варианта и выполни победивший.", "В конце ролика оставь голосование за следующий выпуск"],
            ["До/после", "Покажи результат улучшения навыка, дизайна или игрового предмета.", "Сделай быстрый переход между началом и результатом"]
        ],
        "💰 Заработок": [
            ["Превью для игровых видео", "Делай простые превью для небольших каналов.", "Создай 3 примера и предложи знакомым или небольшим авторам"],
            ["Оформление игровых профилей", "Помогай оформлять аватар, описание и визуальный стиль игрового профиля.", "Собери несколько крутых шаблонов"],
            ["Монтаж коротких роликов", "Предлагай простой монтаж Shorts: обрезка, субтитры и переходы.", "Сделай 2-3 примера до/после и покажи авторам"]
        ],
        "💻 Проекты": [
            ["Сайт генератора идей", "Сделай сайт, который случайно выдает идеи по категориям.", "Начни с 50 идей и добавь избранное."],
            ["Трекер целей", "Мини-сайт, где пользователь ставит цель и отмечает прогресс.", "Добавь процент выполнения и сохранение данных в браузере"],
            ["Каталог полезных инструментов", "Собери в одном месте бесплатные инструменты для учебы, игр и творчества.", "Раздели инструменты по категориям"]
        ],
        "📱 Приложения": [
            ["Генератор челленджей", "Приложение случайно выбирает безопасное задание для игры или творчества.", "Сделай категории и кнопку генерации"],
            ["Планировщик контента", "Календарь для идей видео и публикаций.", "Добавь дату, название ролика и статус 'готово'."],
            ["Генератор названий", "Создай генератор названий для каналов, проектов и команд.", "Сделай несколько стилей и кнопку копирования"]
        ],
        "📚 Учеба": [
            ["Генератор вопросов", "Сайт случайно создает вопросы по выбранной теме.", "Добавь уровни сложности и подсчет правильных ответов"],
            ["Карточки для повторения", "Интерактивные карточки «вопрос — ответ».", "Начни с одной школьной темы и постепенно добавляй новые"],
            ["Помощник расписания", "Простой планировщик уроков и домашних заданий.", "Добавь приоритет и отметку выполненных задач."]
        ]
    };

    let category = "🎮 Игры", current=null;
    const cats_document = document.getElementById("cats");

    Object.keys(data).forEach((c => {
        let b = document.createElement("button");
        b.className = "cat" + (c === category ? " active" : "");
        b.textContent = c;
        b.onclick = () => {
            document.querySelectorAll(".cat").forEach(btn => btn.classList.remove("active"));
            b.classList.add("active");
            category = c;
        };
        cats_document.appendChild(b);
    }));

    function generate() {
        const arr = data[category], item = arr[Math.floor(Math.random() * arr.length)];
        current = { category, title: item[0], desc: item[1], start: item[2] };
        document.getElementById("tag").textContent = category;
        document.getElementById("title").textContent = item[0];
        document.getElementById("desc").textContent = item[1];
        document.getElementById("start").textContent = item[2];
        document.getElementById("result").style.display = "block";
        
        let h = JSON.parse(localStorage.getItem("ideas") || "[]");
        h.unshift(item[0]);
        h = h.slice(0, 5);
        localStorage.setItem("ideas", JSON.stringify(h));
        renderHistory();
    }

    function renderHistory() {
        let h = JSON.parse(localStorage.getItem("ideas") || "[]");
        document.getElementById("history").innerHTML = h.length ? h.map(i => `<div>• ${escapeHtml(i)}</div>`).join("") : "Пока пусто — сгенерируй первую идею.";
    }

    function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function copyIdea() {
        if (!current) return;
        let t = `${current.title}\n${current.desc}\nКак начать: ${current.start}`;
        try { await navigator.clipboard.writeText(t); alert("Идея скопирована!"); } catch { alert("Не удалось скопировать."); }
    }

    renderHistory();
    </script>
</body>
</html>
